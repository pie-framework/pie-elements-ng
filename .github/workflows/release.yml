# Creates versioning PRs (changesets) and publishes to npm from CI.
#
# Publishing currently authenticates with the NPM_TOKEN secret: `auto` mode below resolves to
# token auth when that secret is present, and FAILS THE RUN when it is absent rather than
# falling through to OIDC. The OIDC machinery here is complete and exercised (npm floor,
# .npmrc scrub, provenance check), but the cutover is BLOCKED and the secret must not be
# deleted yet. Opting into OIDC requires an explicit manual run with publish_auth=oidc.
#
# Why: npm permits exactly one trusted publisher per package, and most of the names this repo
# publishes are also published by pie-framework/pie-elements and pie-framework/pie-lib, which
# are still active — this repo ships `-next.N` prereleases of the same packages those repos
# release as stable. As of 2026-07-31, 50 of 74 packages already have a trusted publisher
# bound to one of those repos' ci.yml. Auth mode applies to a whole publish run, so flipping
# to OIDC would fail every one of them with ENEEDAUTH and produce a partial release — the
# failure mode pie-players hit when its token was removed before its packages were configured.
#
# See the "Shared packages" note in scripts/configure-trusted-publishers.mjs. The secret can be
# removed only once `bun run trusted-publishers -- --verify` reports CONFIGURED for every
# package. See also the "Resolve npm publish auth mode" step below.
#
# CI publishing is gated on ENABLE_CICD_NPM_PUBLISH, currently 'true'.
name: Release

on:
  push:
    branches:
      - master
      - develop
    # Avoid running release on docs-only changes.
    # Releases should be driven by Changesets (new .changeset files) and the
    # resulting version-bump commits (packages/*/package.json + CHANGELOG.md).
    paths:
      - ".changeset/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - "tsconfig*.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release_intent:
        description: "What should this manual run do? ('publish' is rejected unless ENABLE_CICD_NPM_PUBLISH is 'true'.)"
        required: true
        type: choice
        options:
          - version-pr
          - publish
        default: version-pr
      force_publish:
        description: "Allow manual publish even when version-bump detection is false (use for reruns/recovery)"
        required: false
        type: boolean
        default: false
      version_type:
        description: 'Version bump type (major/minor/patch)'
        required: false
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
      publish_auth:
        description: "Publish auth mode for manual publish runs"
        required: false
        type: choice
        options:
          - auto
          - token
          - oidc
        default: auto
      release_channel:
        description: "Publish channel (auto maps branch: master->stable, develop->next)"
        required: false
        type: choice
        options:
          - auto
          - stable
          - next
          - beta
        default: auto
      release_packages:
        description: "Optional comma-separated package names for manual publish recovery"
        required: false
        type: string
        default: ""

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release to NPM
    runs-on: ubuntu-latest
    env:
      PUBLISH_NPM_TOKEN: ""
      PUBLISH_NODE_AUTH_TOKEN: ""
      # Set to 'false' to stop CI publishing and leave this workflow raising version PRs only.
      ENABLE_CICD_NPM_PUBLISH: "true"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, and the Node in .nvmrc still bundles
      # npm 10.9.2. Harmless on token-auth runs, required on OIDC runs.
      - name: Ensure npm supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          echo "bundled npm: $(npm --version)"
          npm install -g npm@^11.5.1
          NPM_VERSION="$(npm --version)"
          echo "npm now: ${NPM_VERSION}"
          NPM_VERSION="$NPM_VERSION" node -e '
            const [maj, min, pat] = process.env.NPM_VERSION.split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) {
              console.error(`npm ${process.env.NPM_VERSION} is below the 11.5.1 required for trusted publishing`);
              process.exit(1);
            }
          '

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect release intent (changesets or version bumps)
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # In prerelease mode, consumed changesets remain on disk and are tracked
          # in .changeset/pre.json. Only count pending changesets as release intent.
          node scripts/release-detect-intent.mjs >> "$GITHUB_OUTPUT"

          # Did this push include actual package version bumps (i.e. merged release PR)?
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          changed_manifests="$(git diff --name-only "$before" "$after" -- 'packages/**/package.json' 'tools/**/package.json' || true)"

          has_version_bumps=false
          for manifest in $changed_manifests; do
            if ! node -e 'const fs=require("fs"); const p=process.argv[1]; try { const pkg=JSON.parse(fs.readFileSync(p, "utf8")); process.exit(pkg.private ? 1 : 0); } catch { process.exit(1); }' "$manifest"; then
              continue
            fi
            manifest_diff="$(git diff -U0 "$before" "$after" -- "$manifest" || true)"
            # Require both removed and added "version" lines to avoid treating
            # metadata-only package.json edits as publish intents.
            if echo "$manifest_diff" | grep -Eq '^-[[:space:]]*"version"[[:space:]]*:' && echo "$manifest_diff" | grep -Eq '^\+[[:space:]]*"version"[[:space:]]*:'; then
              has_version_bumps=true
              break
            fi
          done

          echo "has_version_bumps=${has_version_bumps}" >> "$GITHUB_OUTPUT"

      - name: Validate manual release intent prerequisites
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          intent="${{ inputs.release_intent }}"
          has_changesets="${{ steps.detect.outputs.has_changesets }}"
          has_version_bumps="${{ steps.detect.outputs.has_version_bumps }}"
          force_publish="${{ inputs.force_publish }}"

          if [ "$intent" = "version-pr" ] && [ "$has_changesets" != "true" ]; then
            echo "Manual intent 'version-pr' requires at least one .changeset/*.md file in this commit."
            exit 1
          fi

          if [ "$intent" = "publish" ] && [ "$has_version_bumps" != "true" ] && [ "$force_publish" != "true" ]; then
            echo "Manual intent 'publish' requires package.json/CHANGELOG.md version bump changes."
            echo "If you are rerunning/recovering a failed publish from master, re-run with force_publish=true."
            exit 1
          fi

          if [ "$intent" = "publish" ] && [ "${ENABLE_CICD_NPM_PUBLISH:-false}" != "true" ]; then
            echo "Automated npm publish from GitHub Actions is disabled (ENABLE_CICD_NPM_PUBLISH != true)."
            echo "Publish manually, or set ENABLE_CICD_NPM_PUBLISH=true on the release job in .github/workflows/release.yml."
            exit 1
          fi

      - name: Resolve release channel
        if: env.ENABLE_CICD_NPM_PUBLISH == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.release_intent == 'publish') || (github.event_name != 'workflow_dispatch' && steps.detect.outputs.has_version_bumps == 'true'))
        id: release_channel
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="${{ inputs.release_channel }}"
            if [ "${{ inputs.release_intent }}" != "publish" ]; then
              channel="auto"
            fi
          else
            channel="auto"
          fi

          if [ "${channel}" = "auto" ]; then
            if [ "${ref_name}" = "develop" ]; then
              channel="next"
            elif [ "${ref_name}" = "master" ]; then
              channel="stable"
            else
              echo "Auto release channel is only supported on master or develop; got ${ref_name}" >&2
              exit 1
            fi
          fi

          case "${channel}" in
            stable|next|beta) ;;
            *)
              echo "Unsupported release channel: ${channel}" >&2
              exit 1
              ;;
          esac

          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          if [ "${channel}" = "stable" ]; then
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=${channel}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved release channel: ${channel}"

      - name: Enforce branch to channel policy
        if: env.ENABLE_CICD_NPM_PUBLISH == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.release_intent == 'publish') || (github.event_name != 'workflow_dispatch' && steps.detect.outputs.has_version_bumps == 'true'))
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${{ github.ref_name }}"
          channel="${{ steps.release_channel.outputs.channel }}"

          if [ "${ref_name}" = "develop" ] && [ "${channel}" != "next" ]; then
            echo "develop branch publish must use release channel 'next'." >&2
            exit 1
          fi
          if [ "${ref_name}" = "master" ] && [ "${channel}" != "stable" ]; then
            echo "master branch publish must use release channel 'stable'." >&2
            exit 1
          fi

          echo "Branch/channel policy validated: ${ref_name} -> ${channel}"

      - name: Stop early (no changesets / no version bumps)
        if: github.event_name != 'workflow_dispatch' && steps.detect.outputs.has_changesets != 'true' && steps.detect.outputs.has_version_bumps != 'true'
        run: |
          echo "No .changeset files and no package version/changelog updates in this push. Skipping release."
          exit 0

      - name: Build packages (publish runs only)
        if: env.ENABLE_CICD_NPM_PUBLISH == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.release_intent == 'publish') || (github.event_name != 'workflow_dispatch' && steps.detect.outputs.has_version_bumps == 'true'))
        run: bun run build

      - name: Run tests (publish runs only)
        if: env.ENABLE_CICD_NPM_PUBLISH == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.release_intent == 'publish') || (github.event_name != 'workflow_dispatch' && steps.detect.outputs.has_version_bumps == 'true'))
        run: bun run test

      - name: Resolve npm publish auth mode
        if: env.ENABLE_CICD_NPM_PUBLISH == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.release_intent == 'publish') || (github.event_name != 'workflow_dispatch' && steps.detect.outputs.has_version_bumps == 'true'))
        id: npm_auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          REGISTRY="$(npm config get registry)"
          echo "npm registry: ${REGISTRY}"
          if [ "${REGISTRY}" != "https://registry.npmjs.org/" ]; then
            echo "Unexpected npm registry configured: ${REGISTRY}" >&2
            exit 1
          fi

          publish_auth_input="auto"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            publish_auth_input="${{ inputs.publish_auth }}"
          fi

          if [ "${publish_auth_input}" = "token" ]; then
            if [ -z "${NPM_TOKEN:-}" ]; then
              echo "publish_auth=token requires NPM_TOKEN secret." >&2
              exit 1
            fi
            echo "mode=token" >> "$GITHUB_OUTPUT"
          elif [ "${publish_auth_input}" = "oidc" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            # `auto` resolves to token, or fails — it deliberately never falls through to OIDC.
            # A missing token is overwhelmingly more likely to mean the secret expired or was
            # removed than that the cutover happened, and OIDC cannot publish most of these
            # names anyway (see the header). Choosing OIDC here would let changesets bump and
            # commit versions and then fail every shared-package publish with ENEEDAUTH,
            # leaving versions in git that were never released. Fail before the bump instead.
            if [ -n "${NPM_TOKEN:-}" ]; then
              echo "mode=token" >> "$GITHUB_OUTPUT"
            else
              echo "No NPM_TOKEN secret is available, so this release cannot authenticate to npm." >&2
              echo "" >&2
              echo "Not defaulting to OIDC on purpose: npm permits exactly one trusted publisher" >&2
              echo "per package, and most names this repo publishes are still published by" >&2
              echo "pie-framework/pie-elements and pie-framework/pie-lib. An OIDC run would fail" >&2
              echo "those publishes after versions had already been bumped and committed." >&2
              echo "" >&2
              echo "Fix one of:" >&2
              echo "  - Restore the NPM_TOKEN secret (the expected state today), or" >&2
              echo "  - Once 'bun run trusted-publishers -- --verify' reports CONFIGURED for every" >&2
              echo "    package, re-run this workflow manually with publish_auth=oidc to opt in." >&2
              exit 1
            fi
          fi

      - name: Configure token auth for npm publish
        if: env.ENABLE_CICD_NPM_PUBLISH == 'true' && steps.npm_auth.outputs.mode == 'token'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "Using token auth for npm publish."
          echo "PUBLISH_NPM_TOKEN=${NPM_TOKEN}" >> "$GITHUB_ENV"
          echo "PUBLISH_NODE_AUTH_TOKEN=${NPM_TOKEN}" >> "$GITHUB_ENV"

      - name: Configure OIDC auth for npm publish
        if: env.ENABLE_CICD_NPM_PUBLISH == 'true' && steps.npm_auth.outputs.mode == 'oidc'
        shell: bash
        run: |
          set -euo pipefail
          echo "Using OIDC trusted publishing for npm publish."
          echo "PUBLISH_NPM_TOKEN=" >> "$GITHUB_ENV"
          echo "PUBLISH_NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

          # actions/setup-node ran with registry-url, so it wrote an .npmrc containing
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`. Under OIDC there is no
          # token, so that line expands to an empty credential and npm attempts (and fails)
          # token auth instead of falling through to trusted publishing. Strip the auth line,
          # keep the registry line.
          for candidate in "${NPM_CONFIG_USERCONFIG:-}" "${RUNNER_TEMP:-}/.npmrc" "$HOME/.npmrc"; do
            [ -n "$candidate" ] || continue
            [ -f "$candidate" ] || continue
            if grep -q "_authToken" "$candidate"; then
              sed -i.bak '/_authToken/d' "$candidate" && rm -f "$candidate.bak"
              echo "Removed _authToken line from ${candidate}"
            fi
            echo "--- ${candidate} after scrub:"
            sed 's/^/    /' "$candidate"
          done

      # Fail before the version bump, not after. An expired or revoked token surfaces from
      # npm as E404 on publish, which reads like a missing package; by then changesets has
      # already committed the bumped versions, leaving a version in git that was never
      # published. OIDC has no credential to check, hence the token-mode gate.
      - name: Verify npm publish credentials (token mode, publish runs only)
        if: env.ENABLE_CICD_NPM_PUBLISH == 'true' && steps.npm_auth.outputs.mode == 'token' && ((github.event_name == 'workflow_dispatch' && inputs.release_intent == 'publish') || (github.event_name != 'workflow_dispatch' && steps.detect.outputs.has_version_bumps == 'true'))
        env:
          NPM_TOKEN: ${{ env.PUBLISH_NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.PUBLISH_NODE_AUTH_TOKEN }}
        run: node scripts/check-npm-auth.mjs

      - name: Run Changesets release
        if: github.event_name == 'workflow_dispatch' || steps.detect.outputs.has_changesets == 'true' || steps.detect.outputs.has_version_bumps == 'true'
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release:publish:checked
          createGithubReleases: false
          version: bun run version
          title: 'chore(release): version packages [skip-heavy-ci]'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These must come from the resolved auth mode, NOT straight from secrets.NPM_TOKEN.
          # Reading the secret directly here would hand changesets a token even on an OIDC
          # run, defeating the whole auth-mode resolution above: npm would attempt token auth
          # instead of falling through to trusted publishing. In oidc mode both are
          # deliberately empty.
          NPM_TOKEN: ${{ env.PUBLISH_NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.PUBLISH_NODE_AUTH_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          RELEASE_CHANNEL: ${{ steps.release_channel.outputs.channel }}
          RELEASE_PACKAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_packages || '' }}

      # Attestations are the only external signal that a release actually went out via the
      # trusted publisher: the registry does not expose trusted-publisher configuration, so a
      # package silently falling back to token auth is otherwise invisible. Checks exactly the
      # set changesets reported, since versioning here is independent. Advisory on token runs,
      # where no provenance is expected.
      - name: Verify provenance attestations
        if: steps.changesets.outputs.published == 'true'
        continue-on-error: ${{ steps.npm_auth.outputs.mode != 'oidc' }}
        shell: bash
        env:
          PUBLISHED_PACKAGES_JSON: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          printf '%s' "$PUBLISHED_PACKAGES_JSON" > "$RUNNER_TEMP/published.json"
          bun ./scripts/check-provenance.mjs --published-json "$RUNNER_TEMP/published.json"

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # changesets/action outputs `publishedPackages` as a JSON string; parse it before indexing.
          tag_name: v${{ fromJson(steps.changesets.outputs.publishedPackages)[0].version }}
          release_name: Release v${{ fromJson(steps.changesets.outputs.publishedPackages)[0].version }}
          body: |
            ## Changes

            ${{ steps.changesets.outputs.publishedPackages }}

            See CHANGELOG.md files in each package for detailed changes.
          draft: false
          prerelease: false

      - name: Notify Slack on Successful Publish
        if: steps.changesets.outputs.published == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "📦 PIE Elements Package Published to NPM",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "📦 NPM Package Published"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\nv${{ fromJson(steps.changesets.outputs.publishedPackages)[0].version }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Package:*\n${{ fromJson(steps.changesets.outputs.publishedPackages)[0].name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.event.head_commit.url }}|${{ github.sha }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "See the workflow summary for the full published package list."
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || secrets.SLACK_PR_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on Release PR Created/Updated
        if: steps.changesets.outputs.hasChangesets == 'true' && steps.changesets.outputs.published != 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "📝 Release PR updated",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "📝 Release PR Created/Updated"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Release PR:*\n${{ steps.changesets.outputs.pullRequestUrl || 'Created/updated by changesets action' }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || secrets.SLACK_PR_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on Release Failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "❌ PIE Elements Release Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ NPM Release Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.event.head_commit.url }}|${{ github.sha }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.event.head_commit.author.name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || secrets.SLACK_PR_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
