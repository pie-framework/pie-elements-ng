name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# A pull request's newer push cancels its older run. Each push to a branch gets its own group: a
# later push, a documentation-only one included, must not cancel the run validating an earlier one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Decides which jobs this run skips: all but lint for a documentation-only change, all of them for
  # a release or `skip-heavy-ci` pull request. See scripts/lib/change-scope.mjs. The other jobs run
  # on `!cancelled()` and skip only on an explicit 'true', so a broken classifier runs them.
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      skip_code: ${{ steps.scope.outputs.skip_code }}
      skip_lint: ${{ steps.scope.outputs.skip_lint }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: scope
        env:
          SKIP_HEAVY: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'changeset-release/') || contains(github.event.pull_request.title, '[skip-heavy-ci]') || contains(join(github.event.pull_request.labels.*.name, ','), 'skip-heavy-ci')) }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/ci-change-scope.mjs

  lint:
    needs: change-scope
    if: ${{ !cancelled() && needs.change-scope.outputs.skip_lint != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run verify:no-local-paths
      # npm needs repository.url to match the repo it publishes from for provenance, so a
      # manifest drifting off the canonical form silently degrades a release.
      - run: bun run check:repository-metadata
      - run: bun run lint

  dependency-integrity:
    needs: change-scope
    if: ${{ !cancelled() && needs.change-scope.outputs.skip_code != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run verify:dependency-integrity --fail-on-hoist

  build:
    needs: change-scope
    if: ${{ !cancelled() && needs.change-scope.outputs.skip_code != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            packages/*/dist
            packages/*/esm
            apps/*/build
          if-no-files-found: warn

  test:
    needs: change-scope
    if: ${{ !cancelled() && needs.change-scope.outputs.skip_code != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # Tests include package output validation, so build workspace outputs first.
      - run: bun run build
      - run: bun run test
      - uses: codecov/codecov-action@v7
        if: always()
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
