name: A11y Scenarios

on:
  workflow_dispatch:
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe-scenarios:
    name: Axe scenarios and inventory (non-blocking)
    # Non-blocking: this suite is informational while accessibility findings are
    # triaged. It must not fail the PR check. Skip on changeset-release branches
    # and when a PR opts out via the shared [skip-heavy-ci] label/title guard
    # (same guard used by ci.yml).
    if: ${{ !(github.event_name == 'pull_request' && (startsWith(github.head_ref, 'changeset-release/') || contains(github.event.pull_request.title, '[skip-heavy-ci]') || contains(join(github.event.pull_request.labels.*.name, ','), 'skip-heavy-ci'))) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun x svelte-kit sync
        working-directory: apps/element-a11y-demo
      - run: bun run --cwd apps/element-a11y-demo generate-imports
      # No build step: the Playwright config serves the app via `bun run dev`
      # (Vite), which compiles element sources on the fly, so a production build
      # is not needed for the a11y scan run.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:a11y
      # The broad inventory sweep (~7 min) is skipped on regular PRs to keep
      # per-PR feedback fast. It runs on release PRs into master (develop ->
      # master, i.e. base branch master) and on manual dispatch.
      - run: bun run test:a11y:inventory
        if: github.event_name == 'workflow_dispatch' || github.base_ref == 'master'
      - name: Publish a11y report to job summary
        if: always()
        run: |
          report_dir="apps/element-a11y-demo/test-results/a11y"
          {
            echo "# Axe Accessibility Report (non-blocking)"
            echo
            echo "_Informational suite — it does not block merges. Download the \`axe-a11y-reports\` artifact for full JSON and Playwright HTML detail, including selectors, DOM context, and suggested Jira titles._"
            echo
            if [ -f "$report_dir/axe-a11y-scenarios-report.md" ]; then
              echo "## Curated scenarios"
              echo
              head -c 400000 "$report_dir/axe-a11y-scenarios-report.md"
              echo
            else
              echo "> Scenario report not found ($report_dir/axe-a11y-scenarios-report.md)."
              echo
            fi
            if [ -f "$report_dir/axe-a11y-report.md" ]; then
              echo "## Inventory baseline"
              echo
              head -c 400000 "$report_dir/axe-a11y-report.md"
              echo
            elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "_The broad inventory baseline runs only on release PRs into \`master\` (and on manual dispatch), so it is not included for this PR._"
              echo
            else
              echo "> Inventory report not found ($report_dir/axe-a11y-report.md)."
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axe-a11y-reports
          path: |
            apps/element-a11y-demo/test-results/a11y/
            apps/element-a11y-demo/playwright-a11y-report/
          if-no-files-found: warn
          retention-days: 30
