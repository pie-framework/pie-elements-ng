# Fail the commit or push when the hook finds no lefthook. The default prints "Can't find lefthook
# in PATH" and exits 0, which lets it through with no gate run. `bun install` restores lefthook;
# `--no-verify` or `LEFTHOOK=0` skips the hooks for one command.
assert_lefthook_installed: true

pre-commit:
  parallel: true
  commands:
    dependency-integrity-fast:
      run: bun run verify:dependency-integrity --fail-on-hoist
    lint:
      glob: "*.{js,ts,svelte}"
      run: bun run lint:fix {staged_files}
    # No glob: the script reads the staged paths itself, so that a commit deleting a .ts file
    # still type-checks the package it leaves behind.
    types:
      run: node scripts/type-check-staged.mjs

pre-push:
  jobs:
    # The gate (build, dependency integrity, tests) lives in scripts/pre-push-gate.mjs, which skips
    # it for a push that adds no commits or changes documentation only; `use_stdin` hands it the
    # pushed refs. A script job, because lefthook skips a pre-push `run:` command whose push-file
    # list is empty, as for a push whose commits only delete files (evilmartians/lefthook#1191).
    - name: gate
      script: pre-push-gate.sh
      runner: sh
      use_stdin: true
