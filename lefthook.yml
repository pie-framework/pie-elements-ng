# Fail the commit or push when the hook finds no lefthook. The default prints "Can't find lefthook
# in PATH" and exits 0, which lets it through with no gate run. `bun install` restores lefthook;
# `--no-verify` or `LEFTHOOK=0` skips the hooks for one command.
assert_lefthook_installed: true

pre-commit:
  parallel: true
  commands:
    dependency-integrity-fast:
      run: bun run verify:dependency-integrity --fail-on-hoist
    lint:
      glob: "*.{js,ts,svelte}"
      run: bun run lint:fix {staged_files}
    types:
      glob: "*.{ts,tsx}"
      run: bunx tsc --noEmit

pre-push:
  parallel: false
  commands:
    dependency-integrity-full:
      run: bun run verify:dependency-integrity --check-peer-gaps --fail-on-hoist --fail-on-peer
    test:
      run: bun run test
    build:
      run: bun run build
